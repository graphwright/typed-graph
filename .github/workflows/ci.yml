name: CI

on:
  push:
    branches: [main, k8s]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # k8s-exercise/ is a throwaway learning artifact (see its README) and is
      # explicitly not held to this repo's strict typing discipline.
      - name: mypy --strict
        run: uv run mypy --strict --exclude '^k8s-exercise/' .

      - name: pytest
        run: uv run pytest
